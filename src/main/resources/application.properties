spring.application.name=github-repo-popularity-scorer
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n
server.port=8081

popularity.weights.stars=0.6
popularity.weights.forks=0.3
popularity.weights.recency=0.1
popularity.weights.recency-max-days=365

github.api.base-url=https://api.github.com
github.api.search-repo-path=/search/repositories
github.api.api-version=2022-11-28
github.api.sort=stars
github.api.order=desc
github.api.per-page=30
github.api.max-pages=3
# Set via environment variable: GITHUB_TOKEN=ghp_xxxx
github.api.token=${GITHUB_TOKEN:}

cache.github-repositories.maximum-size=100
cache.github-repositories.expire-after-write-minutes=10

springdoc.swagger-ui.path=/swagger-ui.html
